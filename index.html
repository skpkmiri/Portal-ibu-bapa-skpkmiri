<body>
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyATLymPIGARVMIUTYSyqPN6PFL90IcUI0w",
            authDomain: "portal-ibubapa-skpk-miri.firebaseapp.com",
            projectId: "portal-ibubapa-skpk-miri",
            storageBucket: "portal-ibubapa-skpk-miri.firebasestorage.app",
            messagingSenderId: "303742388032",
            appId: "1:303742388032:web:38ce6d0c7092132ab5dca5",
            measurementId: "G-W5Z4TPPW14"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const Icon = ({ name, size = 24, className = "" }) => {
            const spanRef = React.useRef(null);
            React.useEffect(() => {
                if (spanRef.current && window.lucide) {
                    spanRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
                    window.lucide.createIcons({ root: spanRef.current, attrs: { class: className, width: size, height: size, 'stroke-width': 2 } });
                }
            }, [name, size, className]);
            return <span ref={spanRef} className="inline-flex items-center justify-center"></span>;
        };

        const ZoomImage = ({ src, alt, className, fallbackText }) => {
            const [isZoomed, setIsZoomed] = React.useState(false);
            
            return (
                <React.Fragment>
                    <div className="relative w-full cursor-zoom-in group" onClick={() => setIsZoomed(true)}>
                        <img 
                            src={src} 
                            alt={alt} 
                            className={className} 
                            onError={(e) => e.target.src=`https://placehold.co/600x400/eeeeee/999999?text=${fallbackText}`} 
                        />
                        <div className="absolute top-2 right-2 bg-white/90 p-1.5 rounded-lg shadow-sm border opacity-80 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                            <Icon name="zoom-in" size={16} className="text-gray-700" />
                        </div>
                    </div>
                    
                    {isZoomed && (
                        <div className="fixed inset-0 z-[100] bg-black/95 overflow-auto touch-pan-x touch-pan-y" onClick={(e) => { e.stopPropagation(); setIsZoomed(false); }}>
                            <div className="min-h-full min-w-full table">
                                <div className="table-cell align-middle text-center p-2 sm:p-8">
                                    <img 
                                        src={src} 
                                        alt={alt} 
                                        className="inline-block w-[200%] sm:w-auto max-w-[300%] sm:max-w-full h-auto cursor-zoom-out shadow-2xl" 
                                        onError={(e) => e.target.src=`https://placehold.co/600x400/eeeeee/999999?text=${fallbackText}`}
                                        onClick={(e) => { e.stopPropagation(); setIsZoomed(false); }}
                                    />
                                </div>
                            </div>
                            <button onClick={(e) => { e.stopPropagation(); setIsZoomed(false); }} className="fixed top-4 right-4 bg-gray-700/50 hover:bg-gray-700 text-white p-2 rounded-full z-[110] transition-colors">
                                <Icon name="x" size={24} />
                            </button>
                        </div>
                    )}
                </React.Fragment>
            );
        };

        const initialMenuItems = [
            { id: '0', title: 'PIBG', icon: 'heart-handshake', color: 'text-indigo-600', bgColor: 'bg-indigo-100', url: 'https://skpkmiri.github.io/PIBG/', isStatic: false },
            { id: '1', title: 'JADUAL WAKTU KELAS', icon: 'calendar-clock', color: 'text-blue-600', bgColor: 'bg-blue-100', url: 'https://drive.google.com/file/d/1bq3ErkslIPpue8GfuP9htQ6AgLoSrirw/view?usp=sharing', isStatic: false },
            { id: '2', title: 'JADUAL PERJUMPAAN KOKURIKULUM', icon: 'trophy', color: 'text-amber-600', bgColor: 'bg-amber-100', url: 'https://jadualperjumpaankoko.sekolah-8943-cm1.workers.dev/', isStatic: false },
            { id: '3', title: 'KELAB DAN PERSATUAN', icon: 'users', color: 'text-purple-600', bgColor: 'bg-purple-100', url: 'https://senaraiahlikelab.sekolah-8943-cm1.workers.dev/', isStatic: false },
            { id: '4', title: 'RUMAH SUKAN', icon: 'medal', color: 'text-emerald-600', bgColor: 'bg-emerald-100', isStatic: true, popup: { title: 'Pilih Rumah Sukan', content: 'rumah-sukan' } },
            { id: '5', title: 'JADUAL PENGGUNAAN BAJU', icon: 'shirt', color: 'text-cyan-600', bgColor: 'bg-cyan-100', isStatic: true, popup: { title: 'Jadual Pemakaian Baju', content: 'jadual-baju' } },
            { id: '6', title: 'JADUAL MINGGU SUKAN', icon: 'calendar-days', color: 'text-rose-600', bgColor: 'bg-rose-100', isStatic: true, popup: { title: 'Jadual Minggu Sukan', content: 'minggu-sukan' } }
        ];

        const App = () => {
            const [showModal, setShowModal] = React.useState(false);
            const [modalContent, setModalContent] = React.useState({ title: '', content: null });
            const [showSocialMenu, setShowSocialMenu] = React.useState(false);
            const [showRekodMenu, setShowRekodMenu] = React.useState(false);
            
            const [stats, setStats] = React.useState({ total: 0, today: 0 });
            const hasCounted = React.useRef(false);
            
            // Admin states
            const [isAdminMode, setIsAdminMode] = React.useState(false);
            const [showAdminDashboard, setShowAdminDashboard] = React.useState(false);
            const [adminPassword, setAdminPassword] = React.useState('');
            const [showAdminLogin, setShowAdminLogin] = React.useState(false);
            const [loginError, setLoginError] = React.useState('');
            
            // Dynamic Data states (Simulated fetch from DB, falling back to initial)
            const [menuItems, setMenuItems] = React.useState(initialMenuItems);
            const [announcement, setAnnouncement] = React.useState({ active: false, text: "Selamat datang ke Portal SKPK Miri", showOnLoad: false });
            const [hasShownAnnouncement, setHasShownAnnouncement] = React.useState(false);

            // Admin edit states
            const [editingMenuId, setEditingMenuId] = React.useState(null);
            const [editMenuForm, setEditMenuForm] = React.useState({ title: '', url: '', icon: '' });
            const [isAddingNew, setIsAddingNew] = React.useState(false);
            const [formError, setFormError] = React.useState('');

            React.useEffect(() => {
                const todayStr = new Date().toISOString().split('T')[0];
                const statsRef = db.collection('analytics').doc('visitors');

                if (!hasCounted.current) {
                    statsRef.set({
                        total: firebase.firestore.FieldValue.increment(1),
                        [todayStr]: firebase.firestore.FieldValue.increment(1)
                    }, { merge: true }).catch(err => console.log(err));
                    hasCounted.current = true;
                }

                const unsubscribe = statsRef.onSnapshot(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        setStats({
                            total: data.total || 0,
                            today: data[todayStr] || 0
                        });
                    }
                });
                
                // Simulate loading data from LocalStorage for persistence in this demo
                // In a real app, this would come from Firestore
                const savedMenus = localStorage.getItem('skpk_menus');
                if (savedMenus) setMenuItems(JSON.parse(savedMenus));
                
                const savedAnnouncement = localStorage.getItem('skpk_announcement');
                if (savedAnnouncement) {
                    const parsedAnnouncement = JSON.parse(savedAnnouncement);
                    setAnnouncement(parsedAnnouncement);
                    if (parsedAnnouncement.active && parsedAnnouncement.showOnLoad && !hasShownAnnouncement) {
                        setModalContent({ 
                            title: '📢 PENGUMUMAN / NOTIS', 
                            content: <div className="p-4 text-center text-lg">{parsedAnnouncement.text}</div> 
                        });
                        setShowModal(true);
                        setHasShownAnnouncement(true);
                    }
                }

                return () => unsubscribe();
            }, [hasShownAnnouncement]);

            const handleAdminLogin = (e) => {
                e.preventDefault();
                setLoginError('');
                if (adminPassword === 'skpkyba4112') {
                    setIsAdminMode(true);
                    setShowAdminDashboard(true); // Terus buka dashboard
                    setShowAdminLogin(false);
                    setAdminPassword('');
                } else {
                    setLoginError('Katalaluan salah! Sila cuba lagi.');
                }
            };

            const saveMenus = (newMenus) => {
                setMenuItems(newMenus);
                localStorage.setItem('skpk_menus', JSON.stringify(newMenus));
            };

            const handleUpdateMenu = () => {
                setFormError('');
                if (!editMenuForm.title) {
                    setFormError('Sila masukkan Tajuk Pautan.');
                    return;
                }
                
                let updatedMenus;
                if (isAddingNew) {
                    const newId = Date.now().toString();
                    const colors = [
                        { color: 'text-indigo-600', bgColor: 'bg-indigo-100' },
                        { color: 'text-blue-600', bgColor: 'bg-blue-100' },
                        { color: 'text-amber-600', bgColor: 'bg-amber-100' },
                        { color: 'text-purple-600', bgColor: 'bg-purple-100' },
                        { color: 'text-emerald-600', bgColor: 'bg-emerald-100' },
                        { color: 'text-cyan-600', bgColor: 'bg-cyan-100' },
                        { color: 'text-rose-600', bgColor: 'bg-rose-100' },
                        { color: 'text-teal-600', bgColor: 'bg-teal-100' }
                    ];
                    const randomColor = colors[Math.floor(Math.random() * colors.length)];
                    
                    const newItem = {
                        id: newId,
                        title: editMenuForm.title.toUpperCase(),
                        url: editMenuForm.url || '#',
                        icon: editMenuForm.icon || 'link',
                        isStatic: false,
                        ...randomColor
                    };
                    updatedMenus = [...menuItems, newItem];
                } else {
                    updatedMenus = menuItems.map(item => {
                        if (item.id === editingMenuId) {
                            return { 
                                ...item, 
                                title: editMenuForm.title.toUpperCase(),
                                url: editMenuForm.url || item.url,
                                icon: editMenuForm.icon || item.icon
                            };
                        }
                        return item;
                    });
                }
                
                saveMenus(updatedMenus);
                setEditingMenuId(null);
                setIsAddingNew(false);
                setEditMenuForm({ title: '', url: '', icon: '' });
            };

            const confirmDeleteMenu = (id) => {
                setModalContent({
                    title: 'Pengesahan',
                    content: (
                        <div className="flex flex-col items-center gap-4 p-4 w-full">
                            <p className="text-center text-sm text-gray-600">Anda pasti mahu memadam pautan ini?</p>
                            <div className="flex gap-2 w-full mt-2">
                                <button onClick={() => setShowModal(false)} className="flex-1 py-2 bg-gray-100 rounded-lg font-semibold text-gray-700">Batal</button>
                                <button onClick={() => { saveMenus(menuItems.filter(item => item.id !== id)); setShowModal(false); }} className="flex-1 py-2 bg-red-600 hover:bg-red-700 rounded-lg font-semibold text-white">Padam</button>
                            </div>
                        </div>
                    )
                });
                setShowModal(true);
            };

            const showInfoMessage = (message) => {
                setModalContent({
                    title: 'Makluman',
                    content: <div className="p-4 text-center text-gray-700 font-medium">{message}</div>
                });
                setShowModal(true);
            }

            const saveAnnouncement = (newAnnouncement) => {
                setAnnouncement(newAnnouncement);
                localStorage.setItem('skpk_announcement', JSON.stringify(newAnnouncement));
            };

            const getPopupContent = (type) => {
                switch(type) {
                    case 'rumah-sukan':
                        return (
                            <div className="grid grid-cols-3 gap-2">
                                <button onClick={() => window.open('https://www.canva.com/design/DAGfgAn1odw/7yQsbNfTNSFrqwvH-V3qjw/view', '_blank')} className="p-1 rounded-lg overflow-hidden border bg-white shadow-sm hover:scale-105 transition-transform"><img src="charmander_2.png" className="w-full" alt="Charmander" onError={(e)=>e.target.src='https://placehold.co/100x100/f87171/white?text=Charmander'} /></button>
                                <button onClick={() => window.open('https://www.canva.com/design/DAGfglCnsxw/8any-jTaFqAn2qrcoVKl5g/view', '_blank')} className="p-1 rounded-lg overflow-hidden border bg-white shadow-sm hover:scale-105 transition-transform"><img src="bulbasaur_2.png" className="w-full" alt="Bulbasaur" onError={(e)=>e.target.src='https://placehold.co/100x100/4ade80/white?text=Bulbasaur'} /></button>
                                <button onClick={() => window.open('https://www.canva.com/design/DAGfgodsqO8/lvZ0uMGdXc-vZWw2Otb4Bw/view', '_blank')} className="p-1 rounded-lg overflow-hidden border bg-white shadow-sm hover:scale-105 transition-transform"><img src="squirtle_2.png" className="w-full" alt="Squirtle" onError={(e)=>e.target.src='https://placehold.co/100x100/60a5fa/white?text=Squirtle'} /></button>
                            </div>
                        );
                    case 'jadual-baju':
                        return (
                            <div className="flex flex-col gap-3 w-full">
                                <ZoomImage src="jadual%20pemakaian%20baju.jpg" alt="Jadual Baju 1" className="w-full h-auto rounded-lg shadow-sm border bg-gray-50" fallbackText="Jadual+Baju+1" />
                                <ZoomImage src="jadualbajusukan.jpg" alt="Jadual Baju 2" className="w-full h-auto rounded-lg shadow-sm border bg-gray-50" fallbackText="Jadual+Baju+2" />
                            </div>
                        );
                    case 'minggu-sukan':
                        return (
                            <div className="w-full">
                                <ZoomImage src="jadualsukan.jpg" alt="Jadual Minggu Sukan" className="w-full h-auto block rounded-lg shadow-sm border bg-gray-50" fallbackText="Sila+Muat+Naik+jadualsukan.jpg" />
                            </div>
                        );
                    default: return null;
                }
            };

            return (
                <div className="min-h-screen bg-slate-100 flex justify-center">
                    <div className="w-full max-w-md bg-white shadow-2xl flex flex-col h-screen overflow-hidden relative">
                        
                        {/* Header Section */}
                        <div className="bg-white p-4 border-b flex items-center justify-between shrink-0">
                            <div className="flex items-center gap-3">
                                <button 
                                    className="relative focus:outline-none"
                                    onDoubleClick={() => !isAdminMode && setShowAdminLogin(true)}
                                >
                                    <img src="logo.png" className="h-10 w-10 object-cover rounded-full shadow-sm" alt="Logo" onError={(e)=>e.target.src='https://placehold.co/100x100/e2e8f0/64748b?text=Logo'} />
                                    {isAdminMode && <div className="absolute -bottom-1 -right-1 bg-red-500 rounded-full p-0.5"><Icon name="shield-check" size={10} className="text-white" /></div>}
                                </button>
                                <div>
                                    <h1 className="font-bold text-gray-800 text-[13px] sm:text-[15px] uppercase tracking-tight">PORTAL SKPK MIRI</h1>
                                </div>
                            </div>
                            <div className="flex flex-col items-end justify-center bg-slate-50 border px-2 py-1.5 rounded-lg">
                                <div className="flex items-center gap-1.5 text-[10px] text-gray-600 font-medium">
                                    <Icon name="user-check" size={12} className="text-blue-500" /> Hari ini: {stats.today}
                                </div>
                                <div className="flex items-center gap-1.5 text-[10px] text-gray-600 font-medium mt-0.5">
                                    <Icon name="bar-chart-2" size={12} className="text-emerald-500" /> Total: {stats.total}
                                </div>
                            </div>
                        </div>

                        {/* Announcement Banner */}
                        {announcement.active && announcement.text && (
                            <div className="bg-amber-100/80 border-b border-amber-200 p-2 shrink-0 flex items-center justify-center gap-2">
                                <Icon name="bell" size={14} className="text-amber-700 animate-pulse" />
                                <span className="text-xs font-semibold text-amber-800 truncate px-1">{announcement.text}</span>
                            </div>
                        )}

                        <div className="flex-1 overflow-y-auto p-4 hide-scrollbar bg-slate-50">
                            
                            {/* Toggle View: Admin Dashboard vs Portal View */}
                            {isAdminMode && showAdminDashboard ? (
                                /* ADMIN INLINE DASHBOARD */
                                <div className="flex flex-col gap-4">
                                    <div className="flex items-center gap-2 mb-2">
                                        <div className="p-2 bg-blue-100 rounded-lg text-blue-600">
                                            <Icon name="layout-dashboard" size={20} />
                                        </div>
                                        <div>
                                            <h2 className="font-bold text-gray-800 text-lg leading-tight">Papan Pemuka</h2>
                                            <p className="text-[11px] text-gray-500">Uruskan kandungan portal di sini.</p>
                                        </div>
                                    </div>
                                    
                                    {/* Admin: Notis Section */}
                                    <div className="bg-white p-4 rounded-2xl border shadow-sm">
                                        <h4 className="text-sm font-bold text-gray-700 mb-3 flex items-center gap-2">
                                            <Icon name="bell-ring" size={16} className="text-amber-500" /> Pengumuman & Notis
                                        </h4>
                                        <div className="space-y-3">
                                            <div className="flex items-center justify-between bg-slate-50 p-2 rounded-lg border">
                                                <label className="text-xs font-semibold text-gray-700 flex-1">Aktifkan Notis (Bawah Logo)?</label>
                                                <input type="checkbox" checked={announcement.active} onChange={(e) => saveAnnouncement({...announcement, active: e.target.checked})} className="w-4 h-4 text-blue-600 rounded border-gray-300" />
                                            </div>
                                            <div className="flex items-center justify-between bg-slate-50 p-2 rounded-lg border">
                                                <label className="text-xs font-semibold text-gray-700 flex-1">Pop-up Semasa Buka Portal?</label>
                                                <input type="checkbox" checked={announcement.showOnLoad} onChange={(e) => saveAnnouncement({...announcement, showOnLoad: e.target.checked})} className="w-4 h-4 text-blue-600 rounded border-gray-300" />
                                            </div>
                                            <textarea 
                                                value={announcement.text} 
                                                onChange={(e) => saveAnnouncement({...announcement, text: e.target.value})}
                                                placeholder="Taip teks pengumuman di sini..." 
                                                className="w-full p-3 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" 
                                                rows="3"
                                            />
                                        </div>
                                    </div>

                                    {/* Admin: Menu Section */}
                                    <div className="bg-white p-4 rounded-2xl border shadow-sm">
                                        <div className="flex items-center justify-between mb-4">
                                            <h4 className="text-sm font-bold text-gray-700 flex items-center gap-2">
                                                <Icon name="list" size={16} className="text-blue-500" /> Pautan Menu
                                            </h4>
                                            <button 
                                                onClick={() => { setIsAddingNew(true); setEditingMenuId(null); setEditMenuForm({ title: '', url: '', icon: 'link' }); setFormError(''); }} 
                                                className="text-xs bg-blue-600 text-white px-3 py-1.5 rounded-lg hover:bg-blue-700 font-semibold shadow-sm transition-colors flex items-center gap-1"
                                            >
                                                <Icon name="plus" size={14} /> Tambah
                                            </button>
                                        </div>
                                        <div className="space-y-2">
                                            {menuItems.map(item => (
                                                <div key={item.id} className="flex flex-col gap-1.5 bg-slate-50 p-3 border rounded-xl hover:bg-slate-100 transition-colors">
                                                    <div className="flex items-center justify-between">
                                                        <div className="flex items-center gap-2 flex-1 min-w-0">
                                                            <div className={`p-1.5 rounded-md ${item.bgColor} ${item.color} shrink-0`}><Icon name={item.icon} size={14} /></div>
                                                            <span className="text-xs font-bold text-gray-800 truncate">{item.title}</span>
                                                        </div>
                                                        {!item.isStatic ? (
                                                            <div className="flex gap-1.5 shrink-0 ml-2">
                                                                <button onClick={() => { setEditingMenuId(item.id); setIsAddingNew(false); setEditMenuForm({ title: item.title, url: item.url, icon: item.icon }); setFormError(''); }} className="p-1.5 text-blue-600 bg-white border shadow-sm hover:bg-blue-50 rounded-lg"><Icon name="edit-2" size={14} /></button>
                                                                <button onClick={() => confirmDeleteMenu(item.id)} className="p-1.5 text-red-600 bg-white border shadow-sm hover:bg-red-50 rounded-lg"><Icon name="trash-2" size={14} /></button>
                                                            </div>
                                                        ) : (
                                                            <span className="text-[10px] bg-gray-200 text-gray-600 px-2 py-0.5 rounded-full font-medium ml-2">Statik</span>
                                                        )}
                                                    </div>
                                                    {!item.isStatic && <span className="text-[10px] text-gray-500 truncate">{item.url}</span>}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    
                                    {/* Bottom Spacer for Admin Dashboard */}
                                    <div className="h-4"></div>
                                </div>
                            ) : (
                                /* PORTAL NORMAL VIEW */
                                <div className="flex flex-col gap-3">
                                    
                                    {/* Dynamic and Static Menu Items */}
                                    {menuItems.map(item => (
                                        <button 
                                            key={item.id} 
                                            onClick={() => {
                                                if (item.popup) {
                                                    setModalContent({ title: item.popup.title, content: getPopupContent(item.popup.content) });
                                                    setShowModal(true);
                                                } else {
                                                    window.open(item.url, '_blank');
                                                }
                                            }} 
                                            className="w-full bg-white border p-4 rounded-2xl shadow-sm flex items-center gap-4 hover:bg-slate-50 transition-colors"
                                        >
                                            <div className={`p-3 rounded-xl ${item.bgColor} ${item.color}`}><Icon name={item.icon} /></div>
                                            <h3 className="font-semibold text-gray-800 text-sm flex-1 text-left">{item.title}</h3>
                                            <Icon name="chevron-right" size={20} className="text-gray-300" />
                                        </button>
                                    ))}

                                    {/* Fixed Bottom Menus */}
                                    <button onClick={() => window.open('https://surattidakhadirmurid.sekolah-8943-cm1.workers.dev/', '_blank')} className="w-full bg-white border p-4 rounded-2xl shadow-sm flex items-center gap-4 hover:bg-slate-50 transition-colors">
                                        <div className="p-3 rounded-xl bg-red-100 text-red-600"><Icon name="mail-warning" /></div>
                                        <h3 className="font-semibold text-gray-800 text-sm flex-1 text-left">Surat Tidak Hadir</h3>
                                        <Icon name="chevron-right" size={20} className="text-gray-300" />
                                    </button>

                                    <button onClick={() => setShowRekodMenu(!showRekodMenu)} className="w-full bg-white border p-4 rounded-2xl shadow-sm flex items-center gap-4 hover:bg-slate-50 transition-colors">
                                        <div className="p-3 rounded-xl bg-orange-100 text-orange-600"><Icon name="clipboard-list" /></div>
                                        <h3 className="font-semibold text-gray-800 text-sm flex-1 text-left">Rekod Amalan Murid</h3>
                                        <Icon name={showRekodMenu ? "chevron-up" : "chevron-down"} size={20} className="text-gray-400" />
                                    </button>
                                    {showRekodMenu && (
                                        <div className="flex flex-col gap-2 pl-4">
                                            <button onClick={() => showInfoMessage('Sistem Rekod Amalan Baik sedang dikemaskini.')} className="p-4 bg-white border rounded-xl text-left text-sm font-medium text-green-700 shadow-sm hover:bg-green-50">✓ Rekod Amalan Baik</button>
                                            <button onClick={() => showInfoMessage('Sistem Rekod Salah Laku sedang dikemaskini.')} className="p-4 bg-white border rounded-xl text-left text-sm font-medium text-red-700 shadow-sm hover:bg-red-50">⚠ Rekod Salah Laku</button>
                                        </div>
                                    )}

                                    <button onClick={() => setShowSocialMenu(!showSocialMenu)} className="w-full bg-white border p-4 rounded-2xl shadow-sm flex items-center gap-4 hover:bg-slate-50 transition-colors">
                                        <div className="p-3 rounded-xl bg-pink-100 text-pink-600"><Icon name="smartphone" /></div>
                                        <h3 className="font-semibold text-gray-800 text-sm flex-1 text-left">Media Sosial</h3>
                                        <Icon name={showSocialMenu ? "chevron-up" : "chevron-down"} size={20} className="text-gray-400" />
                                    </button>
                                    {showSocialMenu && (
                                        <div className="grid grid-cols-2 gap-3 pb-4">
                                            {[ {name:'Facebook', img:'facebook.png', link:'#'}, {name:'TikTok', img:'tiktok.png', link:'#'}, {name:'YouTube', img:'youtube.png', link:'#'}].map((s,i) => (
                                                <button key={i} onClick={() => showInfoMessage(`Pautan ${s.name} sedang dikemaskini.`)} className="bg-white border rounded-xl p-4 flex flex-col items-center justify-center gap-2 shadow-sm hover:scale-[1.02] transition-transform">
                                                    <img src={s.img} alt={s.name} className="w-10 h-10 object-contain" onError={(e)=>e.target.src=`https://placehold.co/40x40/e2e8f0/64748b?text=${s.name.charAt(0)}`} />
                                                    <span className="text-xs font-bold text-gray-700">{s.name}</span>
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                        {isAdminMode && (
                            <div className="bg-slate-800 text-white p-3 shrink-0 flex items-center justify-between rounded-t-xl shadow-lg mt-auto z-10 relative">
                                <div className="flex items-center gap-2">
                                    <Icon name="shield" size={16} className="text-blue-400" />
                                    <span className="text-xs font-semibold">Mod Admin Aktif</span>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => setShowAdminDashboard(!showAdminDashboard)} className="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-1.5 rounded-md font-medium transition-colors">
                                        {showAdminDashboard ? 'Lihat Portal' : 'Papan Pemuka'}
                                    </button>
                                    <button onClick={() => { setIsAdminMode(false); setShowAdminDashboard(false); }} className="bg-slate-600 hover:bg-slate-500 text-white text-xs px-3 py-1.5 rounded-md font-medium transition-colors">
                                        Log Keluar
                                    </button>
                                </div>
                            </div>
                        )}

                        
                        {/* Admin Login Modal */}
                        {showAdminLogin && (
                            <div className="fixed inset-0 z-[60] bg-black/60 flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setShowAdminLogin(false)}>
                                <form onSubmit={handleAdminLogin} className="bg-white rounded-3xl p-6 w-full max-w-xs shadow-xl flex flex-col" onClick={e => e.stopPropagation()}>
                                    <div className="flex justify-center mb-4">
                                        <div className="bg-red-100 p-3 rounded-full text-red-600"><Icon name="shield-alert" size={32} /></div>
                                    </div>
                                    <h3 className="font-bold text-center text-gray-800 mb-2">Log Masuk Admin</h3>
                                    <p className="text-xs text-center text-gray-500 mb-4">Sila masukkan katalaluan untuk mengakses panel kawalan.</p>
                                    
                                    {loginError && <p className="text-xs text-red-500 text-center bg-red-50 p-2 rounded-lg mb-3 border border-red-100">{loginError}</p>}
                                    
                                    <input 
                                        type="password" 
                                        value={adminPassword}
                                        onChange={(e) => setAdminPassword(e.target.value)}
                                        placeholder="Katalaluan" 
                                        className="w-full border rounded-xl px-4 py-3 mb-4 focus:outline-none focus:ring-2 focus:ring-red-500 bg-gray-50"
                                        autoFocus
                                    />
                                    <div className="flex gap-2">
                                        <button type="button" onClick={() => { setShowAdminLogin(false); setLoginError(''); setAdminPassword(''); }} className="flex-1 bg-gray-100 text-gray-700 hover:bg-gray-200 transition-colors font-semibold rounded-xl py-3 text-sm">Batal</button>
                                        <button type="submit" className="flex-1 bg-red-600 hover:bg-red-700 transition-colors text-white font-semibold rounded-xl py-3 text-sm">Log Masuk</button>
                                    </div>
                                </form>
                            </div>
                        )}

                        {/* Add/Edit Menu Modal */}
                        {(editingMenuId || isAddingNew) && (
                            <div className="fixed inset-0 z-[70] bg-black/60 flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => { setEditingMenuId(null); setIsAddingNew(false); }}>
                                <div className="bg-white rounded-3xl p-6 w-full max-w-xs shadow-xl flex flex-col" onClick={e => e.stopPropagation()}>
                                    <h3 className="font-bold text-gray-800 mb-4 text-lg border-b pb-2">{isAddingNew ? 'Tambah Pautan Baru' : 'Kemaskini Pautan'}</h3>
                                    
                                    {formError && <p className="text-xs text-red-600 bg-red-50 p-2 rounded-lg mb-3 border border-red-100">{formError}</p>}
                                    
                                    <div className="space-y-4">
                                        <div>
                                            <label className="text-xs font-bold text-gray-700 mb-1.5 block">Tajuk Pautan <span className="text-red-500">*</span></label>
                                            <input type="text" value={editMenuForm.title} onChange={e=>setEditMenuForm({...editMenuForm, title: e.target.value})} className="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Contoh: BUKU TEKS DIGITAL" />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-gray-700 mb-1.5 block">Pautan Penuh (URL)</label>
                                            <input type="url" value={editMenuForm.url} onChange={e=>setEditMenuForm({...editMenuForm, url: e.target.value})} className="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="https://..." />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-gray-700 mb-1.5 block flex justify-between">
                                                <span>Nama Ikon</span>
                                                <a href="https://lucide.dev/icons" target="_blank" className="text-blue-500 hover:underline">Rujuk lucide.dev</a>
                                            </label>
                                            <div className="relative">
                                                <input type="text" value={editMenuForm.icon} onChange={e=>setEditMenuForm({...editMenuForm, icon: e.target.value})} className="w-full border border-gray-300 rounded-xl pl-9 pr-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Contoh: link, book" />
                                                <div className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                                                    <Icon name={editMenuForm.icon || 'link'} size={16} />
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="flex gap-2 mt-6">
                                        <button onClick={() => { setEditingMenuId(null); setIsAddingNew(false); }} className="flex-1 bg-gray-100 text-gray-700 hover:bg-gray-200 transition-colors font-semibold rounded-xl py-2.5 text-sm">Batal</button>
                                        <button onClick={handleUpdateMenu} className="flex-1 bg-blue-600 hover:bg-blue-700 transition-colors text-white font-semibold rounded-xl py-2.5 text-sm">Simpan</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* General Display Modal (Popup Content & Info Messages) */}
                        {showModal && (
                            <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setShowModal(false)}>
                                <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-xl flex flex-col max-h-[90vh]" onClick={e => e.stopPropagation()}>
                                    <h3 className="font-bold text-center text-gray-800 mb-4 shrink-0 text-lg border-b pb-2">{modalContent.title}</h3>
                                    <div className="overflow-y-auto hide-scrollbar flex-1 flex flex-col gap-3 items-center w-full relative">
                                        {modalContent.content}
                                    </div>
                                    <button onClick={() => setShowModal(false)} className="w-full mt-6 bg-slate-800 hover:bg-slate-900 transition-colors text-white font-semibold rounded-xl py-3 shrink-0 text-sm">Tutup</button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
